<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Login - Painel Doce Encantos</title>
<link rel="icon" href="../assets/logo.png" />
<link rel="stylesheet" href="css/admin.css?v=20260905" />
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <img src="../assets/logo.png" alt="Doce Encantos" />
      <h1>Painel Administrativo</h1>
      <div class="subtitle">Doce Encantos &mdash; Gestão de Vendas e Estoque</div>

      <div class="login-error" id="loginError">Usuário ou senha inválidos.</div>

      <form id="loginForm">
        <label for="user">Usuário</label>
        <input type="text" id="user" autocomplete="username" required />

        <label for="pass">Senha</label>
        <input type="password" id="pass" autocomplete="current-password" required />

        <button type="submit" class="btn btn-primary">Entrar</button>
      </form>

      <div class="login-hint">Acesso restrito à administração da loja.</div>
    </div>
  </div>

  <script src="../js/data.js?v=20260905"></script>
  <script>
    var form = document.getElementById("loginForm");
    var errorBox = document.getElementById("loginError");

    // Se já estiver logado, vai direto pro dashboard
    if (DE.Auth.isLogged()) {
      window.location.href = "dashboard.html";
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var user = document.getElementById("user").value.trim();
      var pass = document.getElementById("pass").value;
      if (DE.Auth.login(user, pass)) {
        window.location.href = "dashboard.html";
      } else {
        errorBox.classList.add("show");
      }
    });
  </script>
</body>
</html>
