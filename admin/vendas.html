<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vendas - Painel Doce Encantos</title>
<link rel="icon" href="../assets/logo.png" />
<link rel="stylesheet" href="css/admin.css" />
</head>
<body>

  <header class="shell-bar">
    <div class="shell-left">
      <img src="../assets/logo.png" class="shell-logo" alt="logo" />
      <span class="shell-title">Doce Encantos | Painel Administrativo</span>
    </div>
    <div class="shell-right">
      <div class="shell-user"><div class="shell-avatar">LA</div><span>lalbuquerque</span></div>
      <button class="logout-btn" id="logoutBtn">Sair</button>
    </div>
  </header>

  <div class="app-layout">
    <nav class="side-nav">
      <a href="dashboard.html"><span class="nav-icon">🏠</span> Dashboard</a>
      <a href="vendas.html" class="active"><span class="nav-icon">🧾</span> Vendas</a>
      <a href="venda-manual.html"><span class="nav-icon">🧺</span> Venda manual</a>
      <a href="estoque.html"><span class="nav-icon">📦</span> Estoque</a>
      <a href="caixa.html"><span class="nav-icon">💰</span> Caixa</a>
      <a href="configuracoes.html"><span class="nav-icon">⚙️</span> Configurações</a>
      <a href="../index.html" target="_blank"><span class="nav-icon">🌐</span> Ver loja</a>
    </nav>

    <main class="main-content">
      <div class="breadcrumb">Início &rsaquo; Vendas</div>
      <div class="page-header">
        <h1 class="page-title">Pedidos / Vendas</h1>
      </div>

      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Buscar por cliente ou nº do pedido..." style="min-width:240px;" />
        <select id="statusFilter">
          <option value="">Todos os status</option>
          <option value="Pendente">Pendente</option>
          <option value="Pago">Pago</option>
          <option value="Entregue">Entregue</option>
          <option value="Cancelado">Cancelado</option>
        </select>
        <select id="channelFilter">
          <option value="">Todos os canais</option>
          <option value="site">🌐 Site</option>
          <option value="presencial">🧺 Presencial</option>
        </select>
        <div class="spacer"></div>
        <span id="resultCount" style="color:var(--muted);font-size:12.5px;"></span>
      </div>

      <div class="card">
        <div class="card-body" style="padding:0;">
          <table class="data-table" id="ordersTable">
            <thead>
              <tr>
                <th>Pedido</th><th>Canal</th><th>Data</th><th>Cliente</th><th>WhatsApp</th>
                <th>Itens</th><th>Entrega</th><th>Pagamento</th><th>Total</th><th>Status</th><th>Ações</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal detalhes do pedido -->
  <div id="orderModalOverlay" style="position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:100;">
    <div class="card" style="width:460px;max-width:92vw;margin:0;">
      <div class="card-header">
        <span>Detalhes do pedido</span>
        <button class="btn btn-secondary btn-sm" id="closeOrderModal">✕</button>
      </div>
      <div class="card-body" id="orderModalBody"></div>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="js/admin.js"></script>
  <script>
    ADMIN.guard();
    ADMIN.wireShell();
    var fmt = DE.util.formatBRL;

    function filteredOrders() {
      var search = document.getElementById("searchInput").value.trim().toLowerCase();
      var status = document.getElementById("statusFilter").value;
      var channel = document.getElementById("channelFilter").value;
      return DE.Orders.all().filter(function (o) {
        var matchesSearch = !search ||
          o.customer.name.toLowerCase().indexOf(search) >= 0 ||
          o.code.toLowerCase().indexOf(search) >= 0;
        var matchesStatus = !status || o.status === status;
        var orderChannel = o.channel === "presencial" ? "presencial" : "site";
        var matchesChannel = !channel || orderChannel === channel;
        return matchesSearch && matchesStatus && matchesChannel;
      });
    }

    function render() {
      var orders = filteredOrders();
      document.getElementById("resultCount").textContent = orders.length + " pedido(s)";
      var tbody = document.querySelector("#ordersTable tbody");

      if (orders.length === 0) {
        tbody.innerHTML = '<tr><td colspan="11" class="empty-state">Nenhum pedido encontrado.</td></tr>';
        return;
      }

      tbody.innerHTML = orders.map(function (o) {
        var itemsSummary = o.items.map(function (i) { return i.qty + "x " + i.name; }).join(", ");
        var channelBadge = o.channel === "presencial" ? "🧺 Presencial" : "🌐 Site";
        return "<tr>" +
          "<td>#" + o.code + "</td>" +
          "<td>" + channelBadge + "</td>" +
          "<td>" + DE.util.formatDate(o.createdAt) + "</td>" +
          "<td>" + o.customer.name + "</td>" +
          "<td>" + o.customer.phone + "</td>" +
          "<td>" + itemsSummary + "</td>" +
          "<td>" + (o.customer.deliveryType === "entrega" ? "Entrega" : "Retirada") + "</td>" +
          "<td>" + o.payment + "</td>" +
          "<td>" + fmt(o.total) + "</td>" +
          "<td>" + ADMIN.statusBadge(o.status) + "</td>" +
          "<td>" +
            '<button class="btn btn-secondary btn-sm" data-action="view" data-id="' + o.id + '">Ver</button> ' +
            (o.status === "Pendente" ? '<button class="btn btn-success btn-sm" data-action="pay" data-id="' + o.id + '">Marcar pago</button> ' : "") +
            (o.status === "Pago" ? '<button class="btn btn-success btn-sm" data-action="deliver" data-id="' + o.id + '">Marcar entregue</button> ' : "") +
            (o.status !== "Cancelado" && o.status !== "Entregue" ? '<button class="btn btn-danger btn-sm" data-action="cancel" data-id="' + o.id + '">Cancelar</button>' : "") +
          "</td>" +
        "</tr>";
      }).join("");
    }

    function showOrderDetails(order) {
      var body = document.getElementById("orderModalBody");
      var itemsHtml = order.items.map(function (i) {
        return '<div style="display:flex;justify-content:space-between;margin-bottom:4px;"><span>' + i.qty + "x " + i.name + '</span><span>' + fmt(i.subtotal) + "</span></div>";
      }).join("");
      body.innerHTML =
        "<p><strong>Pedido:</strong> #" + order.code + "</p>" +
        "<p><strong>Data:</strong> " + DE.util.formatDate(order.createdAt) + "</p>" +
        "<p><strong>Cliente:</strong> " + order.customer.name + (order.customer.phone ? " (" + order.customer.phone + ")" : "") + "</p>" +
        "<p><strong>Entrega:</strong> " + (order.customer.deliveryType === "entrega" ? "Entrega - " + order.customer.address : "Retirada no local") + "</p>" +
        (order.customer.notes ? "<p><strong>Observações:</strong> " + order.customer.notes + "</p>" : "") +
        "<hr/>" + itemsHtml + "<hr/>" +
        (order.deliveryFee ? '<div style="display:flex;justify-content:space-between;"><span>Taxa de entrega</span><span>' + fmt(order.deliveryFee) + "</span></div>" : "") +
        '<div style="display:flex;justify-content:space-between;font-weight:700;font-size:15px;margin-top:6px;"><span>Total</span><span>' + fmt(order.total) + "</span></div>" +
        "<p style='margin-top:10px;'><strong>Pagamento:</strong> " + order.payment + " &nbsp; " + ADMIN.statusBadge(order.status) + "</p>";
      document.getElementById("orderModalOverlay").style.display = "flex";
    }

    document.querySelector("#ordersTable tbody").addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-action]");
      if (!btn) return;
      var id = btn.getAttribute("data-id");
      var action = btn.getAttribute("data-action");
      var order = DE.Orders.get(id);

      if (action === "view") {
        showOrderDetails(order);
      } else if (action === "pay") {
        DE.Orders.updateStatus(id, DE.Orders.STATUS.PAGO);
        render();
      } else if (action === "deliver") {
        DE.Orders.updateStatus(id, DE.Orders.STATUS.ENTREGUE);
        render();
      } else if (action === "cancel") {
        if (confirm("Cancelar este pedido? O estoque será devolvido se ainda não estiver pago.")) {
          DE.Orders.updateStatus(id, DE.Orders.STATUS.CANCELADO);
          render();
        }
      }
    });

    document.getElementById("closeOrderModal").addEventListener("click", function () {
      document.getElementById("orderModalOverlay").style.display = "none";
    });

    document.getElementById("searchInput").addEventListener("input", render);
    document.getElementById("statusFilter").addEventListener("change", render);
    document.getElementById("channelFilter").addEventListener("change", render);

    render();
  </script>
</body>
</html>
